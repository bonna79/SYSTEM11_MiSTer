name: Build RBF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with Quartus (inside Docker)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/build \
            -w /build \
            theypsilon/quartus-lite-c5:17.0.2.docker0 \
            bash -xc '
              echo "==== START ===="
              pwd
              ls -la
              export LD_LIBRARY_PATH="/opt/intelFPGA_lite/quartus/linux64:$LD_LIBRARY_PATH"
              /opt/intelFPGA_lite/quartus/linux64/quartus_sh --flow compile SYSTEM11.qpf
              RC=$?
              echo "==== QUARTUS EXIT CODE: $RC ===="
              echo "---- output_files ----"
              ls -la output_files || echo "no output_files directory"
              exit $RC
            '

      - name: Upload RBF
        uses: actions/upload-artifact@v4
        with:
          name: rbf-compilato
          path: output_files/*.rbf
